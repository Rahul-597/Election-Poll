<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Records Manager</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:Arial,sans-serif;margin:0;padding:8px;font-size:16px;overflow-x:hidden}
h3{margin:4px 0 8px}
.ind{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.ind span{border:1px solid #999;padding:8px;word-break:break-word}
.ctl{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}
.ctl input,.ctl select,.ctl button{width:100%;min-height:44px;padding:8px;font-size:16px}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #ccc;padding:6px;text-align:left;word-break:break-word}
td input,td select{width:100%;min-height:40px;font-size:16px;padding:6px}
tr.missed{background:#fdd}
tr.noname{background:#ffd}
@media(min-width:601px){
 .ind{display:flex;flex-wrap:wrap}
 .ctl{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}
@media(min-width:900px){
 body{max-width:1100px;margin:0 auto}
}
@media(max-width:600px){
 thead{display:none}
 table,tbody,tr,td{display:block;width:100%}
 tr{margin-bottom:10px;border:1px solid #999}
 td{border:0;border-bottom:1px solid #ddd;display:flex;gap:8px;align-items:center}
 td:before{content:attr(data-label);font-weight:bold;min-width:70px}
 td input,td select{flex:1}
}
</style>
</head>
<body>
<h3>Records Manager <small id="saved"></small></h3>

<div class="ind" id="ind"></div>

<div class="ctl">
 <input id="q" placeholder="Search name or no" oninput="render()">
 <select id="fc" onchange="render()">
  <option value="">All categories</option>
  <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="U">Uncategorized</option>
 </select>
 <select id="fs" onchange="render()"></select>
 <select id="fst" onchange="render()">
  <option value="">All status</option>
  <option value="available">Available</option>
  <option value="missed">Missed</option>
  <option value="noname">No name</option>
 </select>
</div>

<div class="ctl">
 <input id="ns" placeholder="New street name">
 <button onclick="addStreet()">Add street</button>
 <button onclick="exportCSV()">Export CSV</button>
 <button onclick="backup()">Backup</button>
 <input type="file" id="rf" accept=".json" onchange="restore(this)">
</div>

<p id="count"></p>
<table>
<thead><tr><th>Rec No</th><th>Name</th><th>Category</th><th>Street</th><th>Status</th></tr></thead>
<tbody id="rows"></tbody>
</table>

var CAT={A:"A",B:"B",C:"C",U:"Uncategorized"};
var db=load();

function load(){
 try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}
 var d={records:SEED,streets:[]};
 localStorage.setItem(KEY,JSON.stringify(d));
 return d;
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
 var t=new Date().toLocaleTimeString();
 document.getElementById("saved").textContent="(saved "+t+")";
}
function find(no){return db.records.filter(function(r){return r.no==no})[0];}
function setCat(no,v){find(no).cat=v;save();render();}
function setStreet(no,v){find(no).street=v;save();render();}
function setName(no,v){var r=find(no);r.name=v.trim();r.status=r.name?"available":"noname";save();render();}
function addStreet(){
 var i=document.getElementById("ns"),v=i.value.trim();
 if(!v)return;
 if(db.streets.indexOf(v)>=0){alert("Street already exists");return;}
 db.streets.push(v);i.value="";save();render();
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

function indicators(){
 var R=db.records,c={A:0,B:0,C:0,U:0},m=0,ns=0,nn=0;
 R.forEach(function(r){
  if(r.status=="missed"){m++;return;}
  c[r.cat]++;
  if(!r.street)ns++;
  if(r.status=="noname")nn++;
 });
 document.getElementById("ind").innerHTML=
  "<span>Total: "+R.length+"</span><span>Missed: "+m+"</span>"+
  "<span>Category A: "+c.A+"</span><span>Category B: "+c.B+"</span><span>Category C: "+c.C+"</span>"+
  "<span>Uncategorized: "+c.U+"</span><span>No street: "+ns+"</span><span>No name: "+nn+"</span>"+
  db.streets.map(function(s){
   var n=R.filter(function(r){return r.street==s}).length;
   return "<span>"+esc(s)+": "+n+"</span>";
  }).join("");
}
function streetFilter(){
 var s=document.getElementById("fs"),cur=s.value;
 s.innerHTML='<option value="">All streets</option><option value="__none">No street</option>'+
  db.streets.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
 s.value=cur;
}
function render(){
 indicators();streetFilter();
 var q=document.getElementById("q").value.toLowerCase(),
 fc=document.getElementById("fc").value,
 fs=document.getElementById("fs").value,
 fst=document.getElementById("fst").value;
 var list=db.records.filter(function(r){
  if(q&&(r.name.toLowerCase().indexOf(q)<0&&String(r.no).indexOf(q)<0))return false;
  if(fc&&r.cat!=fc)return false;
  if(fs=="__none"&&r.street)return false;
  if(fs&&fs!="__none"&&r.street!=fs)return false;
  if(fst&&r.status!=fst)return false;
  return true;
 });
 document.getElementById("count").textContent="Showing "+list.length+" of "+db.records.length;
 document.getElementById("rows").innerHTML=list.map(function(r){
  var nm=r.status=="missed"?"-":(r.name?esc(r.name):'<input placeholder="Enter name" onchange="setName('+r.no+',this.value)">');
  var cat="-",st="-";
  if(r.status!="missed"){
   cat='<select onchange="setCat('+r.no+',this.value)">'+
    Object.keys(CAT).map(function(k){return '<option value="'+k+'"'+(r.cat==k?" selected":"")+'>'+CAT[k]+'</option>'}).join("")+'</select>';
   st='<select onchange="setStreet('+r.no+',this.value)"><option value="">-- none --</option>'+
    db.streets.map(function(s){return '<option'+(r.street==s?" selected":"")+'>'+esc(s)+'</option>'}).join("")+'</select>';
  }
  var label=r.status=="missed"?"MISSED":(r.status=="noname"?"NO NAME":"Available");
  return '<tr class="'+r.status+'"><td data-label="Rec No">'+r.no+'</td><td data-label="Name">'+nm+'</td><td data-label="Category">'+cat+'</td><td data-label="Street">'+st+'</td><td data-label="Status">'+label+'</td></tr>';
 }).join("");
}
function download(name,text,type){
 var a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([text],{type:type}));
 a.download=name;a.click();
}
function exportCSV(){
 var out=["Record No,Name,Category,Street,Status"];
 db.records.forEach(function(r){
  out.push([r.no,'"'+r.name.replace(/"/g,'""')+'"',CAT[r.cat],'"'+r.street.replace(/"/g,'""')+'"',r.status].join(","));
 });
 download("records.csv",out.join("\n"),"text/csv");
}
function backup(){download("records_backup.json",JSON.stringify(db),"application/json");}
function restore(inp){
 var f=inp.files[0];if(!f)return;
 var fr=new FileReader();
 fr.onload=function(){
  try{
   var d=JSON.parse(fr.result);
   if(!d.records||!d.streets)throw 1;
   if(!confirm("Replace current data with this backup?"))return;
   db=d;save();render();
  }catch(e){alert("Invalid backup file");}
 };
 fr.readAsText(f);inp.value="";
}
render();
</script>
</body>
</html>
